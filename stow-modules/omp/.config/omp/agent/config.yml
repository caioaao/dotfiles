# modelRoles is set per box (programs.omp.settings -> PI_CONFIG_FILES
# overlay), which overrides anything omp writes here.
defaultThinkingLevel: auto
composer:
  shape: box
theme:
  dark: titanium
  light: light
setupVersion: 2
dev:
  autoqaConsent: denied
# Packages built in nix (nix-modules/shared/omp): MCP servers declared in
# programs.omp.mcpServers, and the /wayfind loop extension.
extensions:
  - /run/current-system/sw/share/omp/caioaao-extra
  - /run/current-system/sw/share/omp/wayfinder-loop